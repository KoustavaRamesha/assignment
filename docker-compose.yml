services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  frontend:
    build:
      context: .
      dockerfile: apps/wind-forecast-check/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m pytest test_wind.py
    profiles: ["test"]
